services:
  postgres:
    image: postgres:16
    container_name: contextual-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: contextual_intelligence
      POSTGRES_USER: contextual_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextual_user -d contextual_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

